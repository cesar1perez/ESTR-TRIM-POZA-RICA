<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Comercial - Llanterama Poza Rica</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --navy-deep: #0f172a;    /* Azul Marino Profundo */
            --navy-light: #1e293b;   /* Azul Marino Suave */
            --blue-accent: #2563eb;  /* Azul Vibrante para detalles */
            --gold-accent: #f59e0b;  /* Dorado para dinero secundario */
            --green-success: #16a34a; /* Verde éxito */
        }
        body { background-color: #f8fafc; font-family: 'Inter', sans-serif; }
        h1, h2, h3, .font-heading { font-family: 'Montserrat', sans-serif; }
        
        /* Tarjeta Principal */
        .card-vendedor { 
            background: white;
            border-radius: 16px; 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            border-top: 6px solid var(--navy-deep); 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .card-vendedor:hover { box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04); }

        /* Barra de Progreso */
        .barra-bg { background: #e2e8f0; height: 12px; border-radius: 6px; overflow: hidden; }
        .barra-fill { height: 100%; transition: width 1.2s cubic-bezier(0.4, 0, 0.2, 1); }

        /* Cajas de Métricas (Derecha) */
        .metric-box { box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); border-radius: 12px; overflow: hidden; }
        .metric-top { background-color: var(--blue-accent); color: white; padding: 6px 0; }
        .metric-bottom { background-color: var(--navy-deep); color: var(--gold-accent); padding: 8px 0; }

        /* Acordeón */
        .detalles-wrapper { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.4s ease-out; }
        .detalles-inner { overflow: hidden; }
        .abierto .detalles-wrapper { grid-template-rows: 1fr; }
        
        .flecha-btn { transition: transform 0.3s ease; }
        .abierto .flecha-btn { transform: rotate(180deg); background-color: #e0f2fe; color: var(--blue-accent); }
    </style>
</head>
<body>

    <header class="bg-slate-900 text-white py-8 shadow-lg border-b-4 border-blue-600">
        <div class="container mx-auto px-6 text-center md:text-left flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-3xl md:text-4xl font-black tracking-tight uppercase">Llanterama <span class="text-blue-400">Poza Rica</span></h1>
                <p class="text-blue-100 font-bold text-sm tracking-[0.2em] mt-2 uppercase opacity-90">Estrategia Trimestral <span class="text-white border-b border-white">ENE-FEB-MARZ</span></p>
            </div>
            <div class="hidden md:block text-right">
                <div class="inline-flex items-center gap-2 bg-white/10 px-4 py-2 rounded-lg backdrop-blur-sm border border-white/20">
                    <div class="w-2 h-2 bg-green-400 rounded-full animate-pulse"></div>
                    <span class="text-xs font-bold uppercase">Datos en Vivo</span>
                </div>
            </div>
        </div>
    </header>

    <section class="container mx-auto px-6 mt-8">
        <div class="bg-white border-l-[6px] border-blue-800 p-6 rounded-r-xl shadow-sm flex items-start gap-4">
            <div class="mt-1 text-blue-800 text-xl"><i class="fas fa-info-circle"></i></div>
            <div>
                <h3 class="font-bold text-slate-800 uppercase text-xs tracking-widest mb-1">Nota Importante</h3>
                <p class="text-slate-700 font-medium text-lg leading-relaxed">
                    Estimado equipo: Para activar el pago de sus bonos, es <span class="text-blue-800 font-extrabold underline decoration-2 decoration-blue-500">indispensable el cumplimiento del 100%</span> en los objetivos de cada línea.
                </p>
            </div>
        </div>
    </section>

    <main class="container mx-auto px-6 py-10 pb-20">
        <div id="grid-vendedores" class="grid grid-cols-1 xl:grid-cols-2 gap-8">
            <div class="col-span-full text-center py-24 opacity-50">
                <i class="fas fa-circle-notch fa-spin text-4xl text-slate-300"></i>
                <p class="mt-4 font-bold text-slate-400 uppercase tracking-widest">Cargando Tablero...</p>
            </div>
        </div>
    </main>

    <script>
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS6P9KM62Giaj8EcnVX4nCEytSekxWqxSdw-JkmBLOf70-XUS4SOyh0_bniRrb47KpTaLkiKf_rr4ug/pub?gid=389713094&single=true&output=csv';

        function init() {
            Papa.parse(CSV_URL, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: (results) => render(results.data)
            });
        }

        // Limpia cualquier string de dinero a número puro
        function cleanNum(val) {
            if (!val) return 0;
            const num = parseFloat(String(val).replace(/[$,% ]/g, ''));
            return isNaN(num) ? 0 : num;
        }

        function toggleVendedor(index) {
            const card = document.getElementById(`card-${index}`);
            card.classList.toggle('abierto');
        }

        function render(rows) {
            const container = document.getElementById('grid-vendedores');
            container.innerHTML = '';

            rows.forEach((row, index) => {
                if (!row.VENDEDOR) return; // Saltar filas vacías

                const nombreDisplay = row.VENDEDOR.replace(/Poza Rica/gi, '').trim();
                const trimestreTxt = row.TRIMESTRE === "1 Q" ? "1° Trimestre" : row.TRIMESTRE;
                
                const card = document.createElement('div');
                card.id = `card-${index}`;
                card.className = 'card-vendedor group'; // Group para efectos hover si se necesitan

                card.innerHTML = `
                    <div class="p-6 md:p-8 cursor-pointer select-none" onclick="toggleVendedor(${index})">
                        <div class="flex justify-between items-center gap-4">
                            <div class="flex items-center gap-5 flex-1">
                                <div class="h-12 w-12 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 shadow-sm border border-slate-200 flecha-btn">
                                    <i class="fas fa-chevron-down text-lg"></i>
                                </div>
                                <div>
                                    <span class="inline-block bg-slate-100 text-slate-600 text-[10px] font-bold px-2 py-0.5 rounded border border-slate-200 uppercase mb-1">${trimestreTxt}</span>
                                    <h2 class="text-2xl md:text-3xl font-heading font-black text-slate-900 leading-none">${nombreDisplay}</h2>
                                    <p class="text-blue-600 text-xs font-bold uppercase tracking-widest mt-1">${row.ZONA.replace(/Poza Rica/gi, '')}</p>
                                </div>
                            </div>

                            <div class="text-right">
                                <div class="bg-gradient-to-br from-green-600 to-green-700 text-white px-5 py-3 rounded-xl shadow-lg shadow-green-900/10 border-t border-green-400">
                                    <p class="text-[9px] font-bold uppercase opacity-90 tracking-wider mb-0.5">Total a Ganar</p>
                                    <p class="text-2xl md:text-3xl font-heading font-black tracking-tight">$${cleanNum(row["TOTAL"]).toLocaleString()}</p>
                                </div>
                            </div>
                        </div>
                        
                        <div class="mt-2 text-center md:text-left md:pl-[4.25rem]">
                            <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest hover:text-blue-600 transition-colors">
                                <i class="fas fa-plus-circle mr-1"></i> Ver desglose de objetivos
                            </span>
                        </div>
                    </div>

                    <div class="detalles-wrapper">
                        <div class="detalles-inner px-6 pb-8 md:px-8 border-t border-slate-100 bg-slate-50/50">
                            <div class="pt-8 space-y-10">
                                ${crearMetrica("Ventas Acumuladores", row["OBJ ACUM"], row["REAL ACUM"], row["%"], row["GANANCIA ACUM"], "bg-blue-700")}
                                ${crearMetrica("Línea Motos", row["OBJ MOTO"], row["REAL MOTO"], row["%_1"], row["GANANCIA MOTO"], "bg-blue-500")}
                                ${crearMetrica("Línea Lubricantes", row["OBJ LUB"], row["REAL LUB"], row["%_2"], row["GANANCIA LUB"], "bg-yellow-500")}

                                <div class="mt-10 pt-6 border-t border-slate-200/60 flex flex-col md:flex-row justify-between items-center gap-4">
                                    <div class="flex items-center gap-4 w-full md:w-auto">
                                        <div class="h-14 w-14 bg-white rounded-2xl flex items-center justify-center shadow-sm border border-slate-100 text-slate-400 text-2xl">
                                            <i class="fas fa-users"></i>
                                        </div>
                                        <div>
                                            <p class="text-lg font-heading font-black text-slate-800 uppercase">Clientes Nuevos</p>
                                            <p class="text-sm font-bold text-slate-500">Acumulado: <span class="text-blue-600 text-lg">${row["ACUM CLIENTES NVO"] || 0}</span></p>
                                        </div>
                                    </div>
                                    
                                    <div class="w-full md:w-40 metric-box">
                                        <div class="bg-slate-700 text-white text-center py-1.5 text-[10px] font-bold uppercase tracking-wider">Bono Clientes</div>
                                        <div class="bg-slate-900 text-green-400 text-center py-2 text-xl font-heading font-black">
                                            $${cleanNum(row["GANANCIA CLTS NVOS"]).toLocaleString()}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function crearMetrica(titulo, obj, real, pct, ganancia, colorBarra) {
            const p = cleanNum(pct);
            const esMeta = p >= 100;
            const colorFinal = esMeta ? 'bg-green-500' : colorBarra;

            return `
                <div class="flex flex-col md:flex-row gap-6 items-start">
                    <div class="flex-1 w-full">
                        <div class="flex justify-between items-end mb-3">
                            <h3 class="text-lg font-heading font-extrabold text-slate-800 uppercase tracking-tight pl-3 border-l-4 border-slate-800 leading-none">${titulo}</h3>
                        </div>
                        
                        <div class="flex gap-8 mb-3 pl-4">
                            <div>
                                <p class="text-[9px] font-bold text-slate-400 uppercase tracking-wider mb-0.5">Objetivo</p>
                                <p class="text-lg font-bold text-slate-500">$${cleanNum(obj).toLocaleString()}</p>
                            </div>
                            <div>
                                <p class="text-[9px] font-bold text-slate-400 uppercase tracking-wider mb-0.5">Real Vendido</p>
                                <p class="text-xl font-black text-slate-900">$${cleanNum(real).toLocaleString()}</p>
                            </div>
                        </div>

                        <div class="barra-bg w-full">
                            <div class="barra-fill ${colorFinal}" style="width: ${Math.min(p, 100)}%"></div>
                        </div>
                    </div>

                    <div class="w-full md:w-36 flex-shrink-0 metric-box self-end md:self-auto">
                        <div class="metric-top text-center relative overflow-hidden">
                            <div class="absolute inset-0 bg-white/10"></div>
                            <p class="text-[10px] font-bold uppercase opacity-80 leading-none mb-1">Progreso</p>
                            <p class="text-3xl font-heading font-black leading-none">${p}%</p>
                        </div>
                        <div class="metric-bottom text-center">
                            <p class="text-[9px] font-bold uppercase opacity-60 text-white leading-none mb-1">Ganancia</p>
                            <p class="text-lg font-heading font-bold leading-none">$${cleanNum(ganancia).toLocaleString()}</p>
                        </div>
                    </div>
                </div>
            `;
        }

        window.onload = init;
        setInterval(init, 300000); // Refrescar cada 5 min
    </script>
</body>
</html>
