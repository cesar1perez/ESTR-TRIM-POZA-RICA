<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedidos Llanterama</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 20px; background: #f0f4f8; color: #333; }
    .header { position: relative; margin-bottom: 20px; text-align: right; }
    h1 { font-family: 'Poppins', sans-serif; color: #1a3c5e; font-size: 2.5em; margin: 0; text-shadow: 3px 3px 6px rgba(26, 60, 94, 0.5); }
    .subtitle { color: #555; font-size: 1.1em; margin: 5px 0 20px; }
    .container { max-width: 900px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 15px; box-shadow: 5px 5px 15px rgba(0,0,0,0.2), -5px -5px 15px rgba(255,255,255,0.8); border: 1px solid #ddd; }
    .section { margin-bottom: 30px; padding: 15px; background: #fafafa; border-radius: 10px; box-shadow: inset 2px 2px 5px rgba(0,0,0,0.1), inset -2px -2px 5px rgba(255,255,255,0.7); }
    .step-label { display: inline-block; background: #1a3c5e; color: white; padding: 5px 10px; border-radius: 20px; font-size: 0.9em; margin-bottom: 10px; }
    label { font-weight: bold; margin-right: 10px; color: #1a3c5e; }
    input, select { padding: 8px; border: 1px solid #ccc; border-radius: 5px; margin: 5px 0; box-shadow: inset 1px 1px 3px rgba(0,0,0,0.1); }
    #vendedorSelect, #clienteInput, #clienteSelect { width: 200px; }
    #clasificacionSelect { width: 200px; }
    #articuloInput, #manualInput { width: 300px; }
    button { padding: 10px 20px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; transition: all 0.3s; margin: 5px; box-shadow: 2px 2px 5px rgba(0,0,0,0.2); }
    button:hover { background: #218838; transform: translateY(-2px); box-shadow: 3px 3px 8px rgba(0,0,0,0.3); }
    #listaPedido { list-style: none; padding: 0; }
    #listaPedido li { padding: 8px; background: #e9ecef; margin: 5px 0; border-radius: 5px; box-shadow: 1px 1px 3px rgba(0,0,0,0.1); }
    #folioOutput { padding: 15px; border-radius: 10px; margin-top: 10px; transition: background 0.3s; box-shadow: 3px 3px 10px rgba(0,0,0,0.2); }
    .folio-unopened { background: #fd7e14; color: white; }
    .folio-opened { background: #6c757d; color: white; }
    .suggestions { position: absolute; background: white; border: 1px solid #ccc; max-height: 150px; overflow-y: auto; width: 300px; border-radius: 5px; display: none; box-shadow: 2px 2px 5px rgba(0,0,0,0.2); }
    .suggestions div { padding: 5px; cursor: pointer; }
    .suggestions div:hover { background: #e9ecef; }
    #confirmBtn { display: none; background: #1a3c5e; }
    #confirmBtn:hover { background: #153048; }
    #pdfBtn, #excelBtn { display: none; background: #007bff; }
    #pdfBtn:hover, #excelBtn:hover { background: #0056b3; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Pedidos Llanterama</h1>
      <div class="subtitle">Crea y gestiona pedidos de manera rápida y sencilla.</div>
    </div>

    <div class="section">
      <span class="step-label">Paso 1: Selecciona Vendedor</span><br>
      <label>Vendedor:</label>
      <select id="vendedorSelect">
        <option value="">Selecciona un vendedor</option>
        <option value="Alejandro Hernández">Alejandro Hernández</option>
        <option value="Alfredo Tapia">Alfredo Tapia</option>
        <option value="Carlos Calderón">Carlos Calderón</option>
        <option value="Marco Hernández">Marco Hernández</option>
        <option value="Miguel Lozada">Miguel Lozada</option>
        <option value="Onésimo Alfaro">Onésimo Alfaro</option>
        <option value="Ruben León">Ruben León</option>
        <option value="Ulises Alvarado">Ulises Alvarado</option>
      </select>
    </div>

    <div class="section">
      <span class="step-label">Paso 2: Crea el Pedido</span>
      <h2>Crear Pedido</h2>
      <label>Cliente:</label><br>
      <input type="text" id="clienteInput" placeholder="Escribe el nombre en MAYÚSCULAS" oninput="filtrarClientes()">
      <div id="clienteSuggestions" class="suggestions"></div><br>
      <select id="clienteSelect">
        <option value="">O busca en la lista</option>
      </select><br><br>

      <label>Clasificación:</label>
      <select id="clasificacionSelect" onchange="filtrarArticulos()">
        <option value="">Todas</option>
      </select><br>
      <label>Artículo:</label><br>
      <input type="text" id="articuloInput" placeholder="Busca por nombre" oninput="filtrarArticulos()">
      <div id="articuloSuggestions" class="suggestions"></div>
      <input type="number" id="cantidadInput" min="1" placeholder="Cantidad" style="width: 80px;">
      <button onclick="agregarArticulo()">Agregar</button><br><br>
      <label>O escribe manualmente:</label><br>
      <input type="text" id="manualInput" placeholder="Producto no listado">
      <input type="number" id="manualCantidad" min="1" placeholder="Cantidad" style="width: 80px;">
      <button onclick="agregarManual()">Agregar Manual</button><br><br>

      <h3>Pedido Actual:</h3>
      <ul id="listaPedido"></ul>
      <button onclick="generarFolio()">Generar Folio</button>
    </div>

    <div class="section">
      <span class="step-label">Paso 3: Revisa y Confirma</span>
      <h2>Folio Generado</h2>
      <div id="folioOutput" onclick="marcarAbierto(this)"></div>
      <button onclick="imprimirFolio()" id="printBtn" style="display: none;">Imprimir</button>
      <button onclick="exportarPDF()" id="pdfBtn">Exportar a PDF</button>
      <button onclick="exportarExcel()" id="excelBtn">Exportar a Excel</button>
      <button onclick="confirmarFolio()" id="confirmBtn">Confirmar</button>
    </div>
  </div>

  <script>
    const clientes = [];
    const productos = [];
    let pedido = [];

    function cargarDatos() {
      fetch('https://docs.google.com/spreadsheets/d/e/2PACX-1vRLYwWEQMX_fChK7Jlls6bpyXb5DG5j3kBfVS5yB-mXyt2qYY5hW-K89lYbz2InjzgAqQ0OWizC8MgT/pub?output=csv')
        .then(response => response.text())
        .then(data => {
          clientes.length = 0;
          const rows = data.split('\n').slice(1);
          rows.forEach(row => {
            const [codigo, cliente] = row.split(',').map(item => item.trim().replace(/"/g, ''));
            clientes.push({ codigo, cliente });
          });
          clientes.sort((a, b) => a.cliente.localeCompare(b.cliente));
          const select = document.getElementById('clienteSelect');
          select.innerHTML = '<option value="">O busca en la lista</option>';
          clientes.forEach(c => {
            const option = document.createElement('option');
            option.value = c.cliente;
            option.textContent = `${c.cliente} (${c.codigo})`;
            select.appendChild(option);
          });
        })
        .catch(error => console.error('Error al cargar clientes:', error));

      fetch('https://docs.google.com/spreadsheets/d/e/2PACX-1vRT4B_s-1ueiKHrK7627W6xhRU0zxbhDlfzHXbDH10E-u76OHyQLlk6d6m6CVr7alrjv7Nj4Qedjg0O/pub?output=csv')
        .then(response => {
          if (!response.ok) throw new Error('Error HTTP: ' + response.status);
          return response.text();
        })
        .then(data => {
          productos.length = 0;
          const rows = data.split('\n').slice(1);
          const clasificaciones = new Set();
          rows.forEach(row => {
            const [clasificacion, codigo, descripcion] = row.split(',').map(item => item.trim().replace(/"/g, ''));
            productos.push({ clasificacion, codigo, descripcion });
          });
          productos.sort((a, b) => a.descripcion.localeCompare(b.descripcion));
          const select = document.getElementById('clasificacionSelect');
          select.innerHTML = '<option value="">Todas</option>';
          Array.from(new Set(productos.map(p => p.clasificacion))).sort().forEach(clasif => {
            const option = document.createElement('option');
            option.value = clasif;
            option.textContent = clasif;
            select.appendChild(option);
          });
        })
        .catch(error => console.error('Error al cargar productos:', error));
    }

    cargarDatos();
    setInterval(cargarDatos, 60000);

    function filtrarClientes() {
      const input = document.getElementById('clienteInput').value.toUpperCase();
      const suggestions = document.getElementById('clienteSuggestions');
      suggestions.innerHTML = '';
      if (input) {
        const matches = clientes.filter(c => c.cliente.toUpperCase().includes(input));
        matches.forEach(c => {
          const div = document.createElement('div');
          div.textContent = `${c.cliente} (${c.codigo})`;
          div.onclick = () => {
            document.getElementById('clienteInput').value = c.cliente;
            suggestions.style.display = 'none';
          };
          suggestions.appendChild(div);
        });
        suggestions.style.display = matches.length ? 'block' : 'none';
      } else {
        suggestions.style.display = 'none';
      }
    }

    function filtrarArticulos() {
      const input = document.getElementById('articuloInput').value.toLowerCase();
      const clasif = document.getElementById('clasificacionSelect').value;
      const suggestions = document.getElementById('articuloSuggestions');
      suggestions.innerHTML = '';
      
      const filteredProductos = productos.filter(p => 
        (!clasif || p.clasificacion === clasif) && 
        p.descripcion.toLowerCase().includes(input)
      );
      
      filteredProductos.forEach(p => {
        const div = document.createElement('div');
        div.textContent = `${p.descripcion} (${p.codigo})`;
        div.onclick = () => {
          document.getElementById('articuloInput').value = p.descripcion;
          suggestions.style.display = 'none';
        };
        suggestions.appendChild(div);
      });
      suggestions.style.display = filteredProductos.length && input ? 'block' : 'none';
    }

    function agregarArticulo() {
      const articulo = document.getElementById('articuloInput').value;
      const cantidad = document.getElementById('cantidadInput').value;
      if (articulo && cantidad) {
        pedido.push({ articulo, cantidad });
        actualizarLista();
        document.getElementById('articuloInput').value = '';
        document.getElementById('cantidadInput').value = '';
        document.getElementById('articuloSuggestions').style.display = 'none';
      } else {
        alert('Especifica un artículo y cantidad.');
      }
    }

    function agregarManual() {
      const articulo = document.getElementById('manualInput').value;
      const cantidad = document.getElementById('manualCantidad').value;
      if (articulo && cantidad) {
        pedido.push({ articulo, cantidad });
        actualizarLista();
        document.getElementById('manualInput').value = '';
        document.getElementById('manualCantidad').value = '';
      } else {
        alert('Especifica un producto manual y cantidad.');
      }
    }

    function actualizarLista() {
      const lista = document.getElementById('listaPedido');
      lista.innerHTML = '';
      pedido.forEach(item => {
        const li = document.createElement('li');
        li.textContent = `${item.cantidad} x ${item.articulo}`;
        lista.appendChild(li);
      });
    }

    function generarFolio() {
      const cliente = document.getElementById('clienteInput').value || document.getElementById('clienteSelect').value;
      const vendedor = document.getElementById('vendedorSelect').value;
      if (!vendedor || !cliente || pedido.length === 0) {
        alert('Selecciona un vendedor, un cliente y agrega al menos un artículo.');
        return;
      }

      const now = new Date();
      const folioNum = 'FOLIO-' + Math.floor(Math.random() * 10000);
      let folioText = `Folio: ${folioNum}<br>` +
                      `Fecha: ${now.toLocaleDateString('es-MX')}<br>` +
                      `Hora: ${now.toLocaleTimeString('es-MX')}<br>` +
                      `Vendedor: ${vendedor}<br>` +
                      `Cliente: ${cliente}<br><br>` +
                      `Artículos:<br>`;
      pedido.forEach(item => {
        folioText += `${item.cantidad} x ${item.articulo}<br>`;
      });

      const output = document.getElementById('folioOutput');
      output.innerHTML = folioText;
      output.className = 'folio-unopened';
      output.style.display = 'block';
      document.getElementById('printBtn').style.display = 'none';
      document.getElementById('pdfBtn').style.display = 'none';
      document.getElementById('excelBtn').style.display = 'none';
      document.getElementById('confirmBtn').style.display = 'inline';
    }

    function confirmarFolio() {
      document.getElementById('printBtn').style.display = 'inline';
      document.getElementById('pdfBtn').style.display = 'inline';
      document.getElementById('excelBtn').style.display = 'inline';
      document.getElementById('confirmBtn').style.display = 'none';
      alert('Folio confirmado. Ahora puedes imprimirlo o exportarlo.');
    }

    function marcarAbierto(element) {
      element.className = 'folio-opened';
    }

    function imprimirFolio() {
      const folio = document.getElementById('folioOutput').innerHTML;
      const win = window.open('', '', 'width=600,height=400');
      win.document.write('<html><body>' + folio + '</body></html>');
      win.document.close();
      win.print();
    }

    function exportarPDF() {
      const folio = document.getElementById('folioOutput').innerHTML;
      const win = window.open('', '', 'width=600,height=400');
      win.document.write('<html><body>' + folio + '</body></html>');
      win.document.close();
      win.print();
    }

    function exportarExcel() {
      const vendedor = document.getElementById('vendedorSelect').value;
      const cliente = document.getElementById('clienteInput').value || document.getElementById('clienteSelect').value;
      const now = new Date();
      const folioNum = document.getElementById('folioOutput').innerHTML.match(/Folio: (FOLIO-\d+)/)[1];
      let csv = 'Folio,Fecha,Hora,Vendedor,Cliente,Artículo,Cantidad\n';
      pedido.forEach(item => {
        csv += `${folioNum},${now.toLocaleDateString('es-MX')},${now.toLocaleTimeString('es-MX')},${vendedor},${cliente},${item.articulo},${item.cantidad}\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `${folioNum}.csv`;
      link.click();
    }
  </script>
</body>
</html>
