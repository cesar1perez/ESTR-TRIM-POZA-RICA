<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Comercial Llanterama - Poza Rica</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primario: #d32f2f;
            --secundario: #1a237e;
            --exito: #2e7d32;
        }
        body { background-color: #f8fafc; font-family: 'Inter', sans-serif; }
        .llanterama-gradient { background: linear-gradient(135deg, #b71c1c 0%, #d32f2f 100%); }
        .card-vendedor { border-top: 4px solid var(--primario); transition: all 0.3s ease; }
        .card-vendedor:hover { transform: translateY(-3px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        .progress-bg { background-color: #e2e8f0; height: 10px; border-radius: 5px; overflow: hidden; }
        .progress-fill { height: 100%; border-radius: 5px; transition: width 1s ease-in-out; }
    </style>
</head>
<body>

    <header class="llanterama-gradient text-white shadow-xl">
        <div class="container mx-auto px-6 py-8">
            <div class="flex flex-col md:flex-row justify-between items-center text-center md:text-left">
                <div>
                    <h1 class="text-3xl font-black tracking-tight uppercase">Estrategia Comercial Trimestral</h1>
                    <p class="text-red-100 font-medium mt-1 italic">"Excelencia en el servicio, liderazgo en el mercado"</p>
                </div>
                <div class="mt-4 md:mt-0 text-right">
                    <div class="bg-black/20 p-3 rounded-lg backdrop-blur-sm border border-white/10">
                        <p class="text-xs uppercase opacity-80 tracking-widest">Sede</p>
                        <p class="font-bold text-xl">POZA RICA</p>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <div class="bg-yellow-50 border-b border-yellow-200 p-3 text-center">
        <p class="text-yellow-800 text-sm font-semibold">
            <i class="fas fa-info-circle mr-2"></i> 
            IMPORTANTE: Se requiere alcanzar el <span class="underline">100% del objetivo</span> en la línea correspondiente para hacer efectiva la reclamación de ganancias.
        </p>
    </div>

    <main class="container mx-auto px-4 py-10">
        <div id="vendedores-grid" class="grid grid-cols-1 xl:grid-cols-2 gap-8">
            <div class="col-span-full text-center py-20">
                <div class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-red-600 border-t-transparent"></div>
                <p class="mt-4 text-gray-500 font-bold uppercase tracking-widest">Sincronizando con Google Sheets...</p>
            </div>
        </div>
    </main>

    <script>
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS6P9KM62Giaj8EcnVX4nCEytSekxWqxSdw-JkmBLOf70-XUS4SOyh0_bniRrb47KpTaLkiKf_rr4ug/pub?gid=389713094&single=true&output=csv';

        function fetchData() {
            Papa.parse(CSV_URL, {
                download: true,
                header: true,
                dynamicTyping: true,
                complete: results => renderDashboard(results.data)
            });
        }

        function renderDashboard(data) {
            const container = document.getElementById('vendedores-grid');
            container.innerHTML = '';

            data.forEach(row => {
                if (!row.VENDEDOR) return;

                // Mapeo de columnas considerando que PapaParse añade sufijos a nombres duplicados
                // OBJ ACUM, REAL ACUM, %, GANANCIA
                // OBJ MOTO, REAL MOTO, %_1, GANANCIA_1
                // OBJ LUB, REAL LUB, %_2, GANANCIA_2

                const card = document.createElement('div');
                card.className = 'bg-white rounded-2xl shadow-sm card-vendedor p-6 flex flex-col justify-between';
                
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-6">
                        <div>
                            <span class="bg-red-100 text-red-700 text-[10px] font-black px-2 py-1 rounded-md uppercase tracking-tighter">${row.TRIMESTRE}</span>
                            <h2 class="text-2xl font-bold text-slate-800 mt-2">${row.VENDEDOR}</h2>
                            <p class="text-gray-400 text-xs font-medium uppercase italic">${row.ZONA}</p>
                        </div>
                        <div class="bg-green-50 p-4 rounded-xl border border-green-100 text-right">
                            <p class="text-[10px] text-green-700 font-bold uppercase tracking-wider mb-1">Ganancia Total</p>
                            <p class="text-3xl font-black text-green-600 leading-none">$${Number(row.TOTAL || 0).toLocaleString()}</p>
                        </div>
                    </div>

                    <div class="space-y-6">
                        ${renderMetric("VENTAS GENERALES", row['OBJ ACUM'], row['REAL ACUM'], row['%'], row['GANANCIA'], "bg-red-600")}
                        
                        ${renderMetric("MOTO", row['OBJ MOTO'], row['REAL MOTO'], row['%_1'], row['GANANCIA_1'], "bg-indigo-700")}

                        ${renderMetric("LUBRICANTES", row['OBJ LUB'], row['REAL LUB'], row['%_2'], row['GANANCIA_2'], "bg-amber-500")}
                    </div>

                    <div class="mt-8 pt-4 border-t border-gray-100 flex justify-between items-center">
                        <div class="flex items-center gap-3">
                            <div class="h-10 w-10 bg-slate-100 rounded-full flex items-center justify-center">
                                <i class="fas fa-user-plus text-slate-500"></i>
                            </div>
                            <div>
                                <p class="text-[10px] font-bold text-gray-400 uppercase">Clientes Nuevos</p>
                                <p class="text-lg font-bold text-slate-700">${row['ACUM CLIENTES NVO'] || 0}</p>
                            </div>
                        </div>
                        <div class="text-right">
                            <p class="text-[10px] font-bold text-gray-400 uppercase">Bono Clientes</p>
                            <p class="text-lg font-bold text-green-600">$${Number(row['GANANCIA_3'] || 0).toLocaleString()}</p>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function renderMetric(label, obj, real, pct, bonus, colorClass) {
            const percentage = parseFloat(pct) || 0;
            // Si el porcentaje es >= 100 el color es éxito, si no, el asignado
            const barColor = percentage >= 100 ? 'bg-green-500' : colorClass;
            
            return `
                <div>
                    <div class="flex justify-between items-end mb-2">
                        <div>
                            <p class="text-xs font-black text-slate-500 uppercase tracking-widest">${label}</p>
                            <p class="text-sm font-medium text-slate-400">Objetivo: <span class="text-slate-600 font-bold">$${Number(obj || 0).toLocaleString()}</span></p>
                        </div>
                        <div class="text-right">
                            <p class="text-lg font-black ${percentage >= 100 ? 'text-green-600' : 'text-slate-700'}">${percentage}%</p>
                            <p class="text-[10px] font-bold text-gray-400 uppercase">Real: $${Number(real || 0).toLocaleString()}</p>
                        </div>
                    </div>
                    <div class="progress-bg">
                        <div class="progress-fill ${barColor}" style="width: ${Math.min(percentage, 100)}%"></div>
                    </div>
                    <div class="flex justify-between mt-1">
                        <p class="text-[10px] italic text-gray-400 font-medium italic">Bono proyectado</p>
                        <p class="text-xs font-bold text-green-700">$${Number(bonus || 0).toLocaleString()}</p>
                    </div>
                </div>
            `;
        }

        window.onload = fetchData;
        // Auto-refresh cada 5 minutos
        setInterval(fetchData, 300000);
    </script>
</body>
</html>
