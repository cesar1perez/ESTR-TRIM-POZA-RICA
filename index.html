<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Estrategia - Llanterama Poza Rica</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,600&family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --azul-llanterama: #1a237e;
            --amarillo-elegante: #f9a825; /* Un amarillo dorado legible */
            --rojo-corporativo: #d32f2f;
        }
        body { background-color: #f0f2f5; font-family: 'Montserrat', sans-serif; }
        .mensaje-corporativo {
            font-family: 'Playfair Display', serif;
            font-size: 1.6rem;
            color: #2c3e50;
        }
        .card-vendedor { 
            border-top: 8px solid var(--azul-llanterama);
            border-radius: 15px;
        }
        .text-objetivo { font-size: 1.1rem; color: #475569; }
        .text-real { font-size: 1.25rem; font-weight: 900; color: #1e293b; }
        .barra-bg { background: #e2e8f0; height: 16px; border-radius: 8px; }
        .barra-fill { height: 100%; border-radius: 8px; transition: width 1s ease; }
        .bg-azul { background-color: var(--azul-llanterama); }
        .bg-amarillo { background-color: var(--amarillo-elegante); }
        .text-amarillo { color: #856404; } /* Para lectura sobre fondo claro */
    </style>
</head>
<body>

    <header class="bg-white shadow-md border-b-2 border-gray-200 py-6">
        <div class="container mx-auto px-6 text-center">
            <h1 class="text-4xl font-black text-blue-900 uppercase tracking-tighter">Llanterama Poza Rica</h1>
            <p class="text-gray-500 font-bold mt-2 uppercase tracking-widest">Dashboard de Rendimiento Comercial</p>
        </div>
    </header>

    <section class="container mx-auto px-6 mt-10">
        <div class="bg-white p-10 rounded-xl shadow-lg border-l-[10px] border-blue-800">
            <p class="mensaje-corporativo italic">
                "Estimado equipo comercial, para validar el reclamo de sus bonificaciones, es <span class="text-blue-800 font-bold underline">obligatorio alcanzar el 100% del objetivo</span> en cada línea de producto individualmente."
            </p>
        </div>
    </section>

    <main class="container mx-auto px-6 py-12">
        <div id="dashboard" class="grid grid-cols-1 xl:grid-cols-2 gap-10">
            </div>
    </main>

    <script>
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS6P9KM62Giaj8EcnVX4nCEytSekxWqxSdw-JkmBLOf70-XUS4SOyh0_bniRrb47KpTaLkiKf_rr4ug/pub?gid=389713094&single=true&output=csv';

        function cargarDatos() {
            // Usamos un fetch manual antes del parse para asegurar que leemos las columnas correctamente
            Papa.parse(CSV_URL, {
                download: true,
                header: true,
                complete: (results) => {
                    dibujarInterfaz(results.data);
                }
            });
        }

        function dibujarInterfaz(data) {
            const container = document.getElementById('dashboard');
            container.innerHTML = '';

            data.forEach(v => {
                if (!v.VENDEDOR) return;

                // Mapeo manual de columnas para evitar errores de nombres duplicados
                const campos = Object.values(v);
                // Basado en tu estructura:
                // 0:TRIMESTRE, 1:ZONA, 2:VENDEDOR, 3:OBJ ACUM, 4:REAL ACUM, 5:%, 6:GANANCIA ACUM
                // 7:OBJ MOTO, 8:REAL MOTO, 9:%, 10:GANANCIA MOTO, 11:OBJ LUB, 12:REAL LUB, 13:%, 14:GANANCIA LUB...

                const card = document.createElement('div');
                card.className = 'bg-white shadow-2xl card-vendedor p-8';

                card.innerHTML = `
                    <div class="flex justify-between items-start mb-10">
                        <div>
                            <span class="text-xl font-black text-blue-800 bg-blue-50 px-4 py-2 rounded-lg">
                                ${v.TRIMESTRE === '1 Q' ? '1 Q - PRIMER TRIMESTRE' : v.TRIMESTRE}
                            </span>
                            <h2 class="text-3xl font-black text-slate-800 mt-6">${v.VENDEDOR}</h2>
                            <p class="text-blue-600 font-bold uppercase tracking-widest">${v.ZONA}</p>
                        </div>
                        <div class="text-right">
                            <div class="bg-green-600 text-white p-5 rounded-2xl shadow-lg">
                                <p class="text-xs font-bold uppercase opacity-80 mb-1">Total Ganancia</p>
                                <p class="text-4xl font-black">$${Number(v['TOTAL']).toLocaleString()}</p>
                            </div>
                        </div>
                    </div>

                    <div class="space-y-12">
                        ${crearBloque("VENTAS ACUMULADAS", v['OBJ ACUM'], v['REAL ACUM'], campos[5], v['GANANCIA ACUM'], "bg-azul")}
                        
                        ${crearBloque("LÍNEA MOTOS", v['OBJ MOTO'], v['REAL MOTO'], campos[9], v['GANANCIA MOTO'], "bg-azul")}

                        ${crearBloque("LÍNEA LUBRICANTES", v['OBJ LUB'], v['REAL LUB'], campos[13], v['GANANCIA LUB'], "bg-amarillo")}
                    </div>

                    <div class="mt-12 pt-6 border-t-2 border-dashed border-gray-100 flex justify-between items-center">
                        <div class="flex items-center gap-4">
                            <i class="fas fa-user-plus text-3xl text-gray-400"></i>
                            <div>
                                <p class="text-xs font-bold text-gray-400 uppercase">Clientes Nuevos</p>
                                <p class="text-2xl font-black text-slate-800">${v['ACUM CLIENTES NVO']}</p>
                            </div>
                        </div>
                        <div class="text-right">
                            <p class="text-xs font-bold text-gray-400 uppercase tracking-tighter">Ganancia Clientes</p>
                            <p class="text-2xl font-black text-green-600">$${Number(v['GANANCIA CLTS NVOS']).toLocaleString()}</p>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function crearBloque(titulo, obj, real, pct, ganancia, colorClase) {
            const porcentaje = parseFloat(pct) || 0;
            const esMetaCumplida = porcentaje >= 100;
            
            return `
                <div class="metric-container">
                    <div class="flex justify-between items-end mb-4">
                        <div class="flex-1">
                            <p class="text-sm font-black text-blue-900 mb-2 tracking-wide uppercase italic border-l-4 border-red-600 pl-2">${titulo}</p>
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <p class="text-xs font-bold text-gray-400 uppercase">OBJETIVO</p>
                                    <p class="text-objetivo font-medium tracking-tight">${Number(obj).toLocaleString()}</p>
                                </div>
                                <div>
                                    <p class="text-xs font-bold text-gray-400 uppercase">REAL VENDIDO</p>
                                    <p class="text-real">${Number(real).toLocaleString()}</p>
                                </div>
                            </div>
                        </div>
                        <div class="text-right ml-4">
                            <p class="text-4xl font-black ${esMetaCumplida ? 'text-green-600' : 'text-slate-700'}">${porcentaje}%</p>
                        </div>
                    </div>
                    
                    <div class="barra-bg mb-3">
                        <div class="barra-fill ${esMetaCumplida ? 'bg-green-500' : colorClase}" style="width: ${Math.min(porcentaje, 100)}%"></div>
                    </div>

                    <div class="flex justify-between items-center bg-gray-50 px-4 py-2 rounded-lg border border-gray-100">
                        <span class="text-[11px] font-black text-gray-500 uppercase tracking-widest">Ganancia de esta Línea:</span>
                        <span class="text-xl font-black text-green-700 tracking-tight">$${Number(ganancia || 0).toLocaleString()}</span>
                    </div>
                </div>
            `;
        }

        window.onload = cargarDatos;
        setInterval(cargarDatos, 300000); // Actualización cada 5 min
    </script>
</body>
</html>
