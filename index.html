<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Estrategia Comercial - Llanterama Poza Rica</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primario: #d32f2f; /* Rojo Llanterama */
            --secundario: #1a237e; /* Azul Marino */
            --fondo: #f4f7f6;
        }
        body { background-color: var(--fondo); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .header-llanterama { background: linear-gradient(90deg, #b71c1c 0%, #d32f2f 100%); }
        .card-vendedor { transition: transform 0.2s; border-left: 5px solid var(--primario); }
        .card-vendedor:hover { transform: translateY(-5px); }
        .progreso-bar { height: 8px; border-radius: 4px; background-color: #e0e0e0; }
        .progreso-fill { height: 8px; border-radius: 4px; background-color: var(--primario); }
        .badge-total { background-color: #2e7d32; color: white; }
    </style>
</head>
<body>

    <header class="header-llanterama text-white p-6 shadow-lg mb-8">
        <div class="container mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-3xl font-bold uppercase tracking-wider">Seguimiento Comercial</h1>
                <p class="opacity-90">Estrategia Trimestral - Premiación Vendedores Poza Rica</p>
            </div>
            <div class="text-right">
                <span id="fecha-actual" class="text-sm block"></span>
                <span class="bg-white text-red-700 px-3 py-1 rounded-full text-xs font-bold uppercase">Actualizado en Vivo</span>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-4 pb-12">
        <div id="vendedores-container" class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <div class="col-span-full text-center py-20">
                <i class="fas fa-spinner fa-spin text-4xl text-red-600"></i>
                <p class="mt-4 text-gray-600 font-medium">Cargando datos de rendimiento...</p>
            </div>
        </div>
    </main>

    <script>
        // URL de tu Google Sheets en formato CSV
        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS6P9KM62Giaj8EcnVX4nCEytSekxWqxSdw-JkmBLOf70-XUS4SOyh0_bniRrb47KpTaLkiKf_rr4ug/pub?gid=389713094&single=true&output=csv';

        function init() {
            document.getElementById('fecha-actual').innerText = new Date().toLocaleDateString('es-MX', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            fetchData();
            // Actualizar cada 5 minutos automáticamente
            setInterval(fetchData, 300000);
        }

        async function fetchData() {
            Papa.parse(csvUrl, {
                download: true,
                header: true,
                dynamicTyping: true,
                complete: function(results) {
                    renderVendedores(results.data);
                }
            });
        }

        function renderVendedores(data) {
            const container = document.getElementById('vendedores-container');
            container.innerHTML = '';

            data.forEach(v => {
                // Saltar filas vacías
                if (!v.VENDEDOR) return;

                const card = document.createElement('div');
                card.className = 'bg-white rounded-xl shadow-md overflow-hidden card-vendedor p-6';
                
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <h2 class="text-xl font-bold text-gray-800">${v.VENDEDOR}</h2>
                            <span class="text-xs font-semibold text-gray-500 uppercase tracking-widest">${v.ZONA} | ${v.TRIMESTRE}</span>
                        </div>
                        <div class="text-right">
                            <span class="text-xs text-gray-400 block uppercase">Ganancia Total</span>
                            <span class="text-2xl font-black text-green-600">$${v.TOTAL?.toLocaleString() || 0}</span>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-6">
                        <div class="bg-gray-50 p-3 rounded-lg border border-gray-100">
                            <p class="text-xs font-bold text-gray-400 uppercase mb-2">Ventas Acum.</p>
                            <div class="flex justify-between text-sm mb-1">
                                <span>${v['%']}%</span>
                                <span class="font-bold text-red-700">$${v['REAL ACUM']?.toLocaleString()}</span>
                            </div>
                            <div class="progreso-bar">
                                <div class="progreso-fill" style="width: ${Math.min(v['%'], 100)}%"></div>
                            </div>
                            <p class="text-[10px] mt-2 text-gray-500">Bono: <span class="text-green-600 font-bold">$${v.GANANCIA?.toLocaleString()}</span></p>
                        </div>

                        <div class="bg-gray-50 p-3 rounded-lg border border-gray-100">
                            <p class="text-xs font-bold text-gray-400 uppercase mb-2"><i class="fas fa-motorcycle mr-1"></i> Obj. Moto</p>
                            <div class="flex justify-between text-sm mb-1">
                                <span>${v['%_1'] || 0}%</span>
                                <span class="font-bold text-red-700">$${v['REAL MOTO']?.toLocaleString()}</span>
                            </div>
                            <div class="progreso-bar">
                                <div class="progreso-fill" style="width: ${Math.min(v['%_1'], 100)}%; background-color: #1a237e;"></div>
                            </div>
                            <p class="text-[10px] mt-2 text-gray-500">Bono: <span class="text-green-600 font-bold">$${v.GANANCIA_1?.toLocaleString()}</span></p>
                        </div>

                        <div class="bg-gray-50 p-3 rounded-lg border border-gray-100">
                            <p class="text-xs font-bold text-gray-400 uppercase mb-2"><i class="fas fa-oil-can mr-1"></i> Obj. Lub</p>
                            <div class="flex justify-between text-sm mb-1">
                                <span>${v['%_2'] || 0}%</span>
                                <span class="font-bold text-red-700">$${v['REAL LUB']?.toLocaleString()}</span>
                            </div>
                            <div class="progreso-bar">
                                <div class="progreso-fill" style="width: ${Math.min(v['%_2'], 100)}%; background-color: #fbc02d;"></div>
                            </div>
                            <p class="text-[10px] mt-2 text-gray-500">Bono: <span class="text-green-600 font-bold">$${v.GANANCIA_2?.toLocaleString()}</span></p>
                        </div>
                    </div>

                    <div class="mt-6 pt-4 border-t border-dashed border-gray-200 flex justify-between items-center">
                        <div class="flex items-center">
                            <div class="bg-red-100 p-2 rounded-full mr-3">
                                <i class="fas fa-users text-red-600 text-sm"></i>
                            </div>
                            <div>
                                <p class="text-[10px] uppercase text-gray-400 font-bold">Clientes Nuevos</p>
                                <p class="font-bold text-gray-700">${v['ACUM CLIENTES NVO'] || 0}</p>
                            </div>
                        </div>
                        <div class="text-right">
                             <p class="text-[10px] uppercase text-gray-400 font-bold">Bono Clientes</p>
                             <p class="font-bold text-green-600">$${v.GANANCIA_3?.toLocaleString() || 0}</p>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        window.onload = init;
    </script>
</body>
</html>
